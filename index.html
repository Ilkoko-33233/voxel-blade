/* ================= Son (synthétisé) ================= */
let actx = null, noiseBuf = null, lastHitSnd = 0;
function initAudio() {

/* ================= Particules ================= */
const PMAX = 4000;
const pMesh = new THREE.InstancedMesh(boxGeo, new THREE.MeshLambertMaterial(), PMAX);
pMesh.frustumCulled = false; pMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
pMesh.instanceMatrix.array.fill(0);

  const i = pNext; pNext = (pNext + 1) % PMAX;

  pVel[i * 3] = vx; pVel[i * 3 + 1] = vy; pVel[i * 3 + 2] = vz;

    pLife[i] -= dt;
    const j = i * 3;
    pVel[j + 1] -= 9.8 * dt;
    pVel[j] *= drag; pVel[j + 2] *= drag;
    pPos[j] += pVel[j] * dt; pPos[j + 1] += pVel[j + 1] * dt; pPos[j + 2] += pVel[j + 2] * dt;
    const s = pLife[i] > 0 ? pSize[i] * Math.sqrt(pLife[i] / pMax[i]) : 0;
    if (pPos[j + 1] < s / 2) { pPos[j + 1] = s / 2; pVel[j + 1] *= -0.3; pVel[j] *= 0.6; pVel[j + 2] *= 0.6; }

    a[o + 4] = 0; a[o + 5] = s; a[o + 6] = 0; a[o + 7] = 0;
    a[o + 8] = 0; a[o + 9] = 0; a[o + 10] = s; a[o + 11] = 0;

/* ================= Chiffres de dégâts ================= */
const numbers = [];

    const g = this.canvas.getContext('2d'); g.clearRect(0, 0, 384, 128);
    const txt = this.label ? this.label : this.ko === 'core' ? 'NOYAU ' + Math.round(this.value) : this.ko ? 'K.O. ' + Math.round(this.value) : String(Math.max(1, Math.round(this.value)));

    g.lineWidth = 12; g.strokeStyle = 'rgba(0,0,0,.85)'; g.strokeText(txt, 192, 66);
    g.fillStyle = this.label ? this.labelColor : this.ko === 'core' ? '#ff6fe0' : this.ko ? '#ff6b4a' : this.crit ? '#ffd23a' : '#ffffff'; g.fillText(txt, 192, 66);

/* ================= Modèles voxel ================= */
function buildModel(nx, ny, nz, shape, paint) {
  const cx = (nx - 1) / 2, cz = (nz - 1) / 2;

  const isS = (i, j, k) => i >= 0 && j >= 0 && k >= 0 && i < nx && j < ny && k < nz && solid[id(i, j, k)];
